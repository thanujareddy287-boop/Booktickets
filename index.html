<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JourneyGo - Bus & Train Booking</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<header class="header"><div class="logo">Journey<span>Go</span></div>
<nav><a href="index.html">Home</a><a href="my-bookings.html">My Bookings</a></nav></header>
<main>
<section class="hero"><h1>Book your journey with ease</h1><p>Bus & Train booking demo application</p>
<div class="search-card">
<div class="tabs"><button class="tab active" data-type="bus">🚌 Bus</button><button class="tab" data-type="train">🚆 Train</button></div>
<form id="searchForm">
<div class="field"><label>From</label><input id="from" required placeholder="e.g. Tirupati"></div>
<div class="field"><label>To</label><input id="to" required placeholder="e.g. Hyderabad"></div>
<div class="field"><label>Journey Date</label><input id="date" type="date" required></div>
<button class="primary" type="submit">Search</button>
</form></div></section>
<section class="features"><div>🚌<b> Bus Booking</b><small>Find and reserve seats</small></div><div>🚆<b> Train Booking</b><small>Search trains and classes</small></div><div>🔒<b> Secure Demo</b><small>Local browser storage</small></div><div>🎫<b> Instant Ticket</b><small>Confirmation after payment</small></div></section>
</main>
<footer>JourneyGo Demo • For educational purposes only</footer>
<script src="js/app.js"></script></body></html>
